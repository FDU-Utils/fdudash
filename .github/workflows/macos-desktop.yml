name: macOS desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - run: npm prune --omit=dev
      - run: node scripts/build-macos.mjs
      - name: Verify local service and Keychain
        run: |
          set -euo pipefail
          helper="$PWD/dist/FDUDash.app/Contents/MacOS/vault"
          echo "Keychain encryption"
          encrypted=$(printf 'c3ludGhldGljLW9ubHk=' | "$helper")
          echo "Keychain decryption"
          decrypted=$(printf '%s' "$encrypted" | "$helper" --decrypt)
          test "$decrypted" = c3ludGhldGljLW9ubHk=
          echo "Launching desktop"
          dist/FDUDash.app/Contents/MacOS/FDUDash &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          node_pid=""
          for i in {1..30}; do
            node_pid=$(pgrep -P "$app_pid" node || true)
            if [ -n "$node_pid" ]; then
              port=$(lsof -a -p "$node_pid" -iTCP -sTCP:LISTEN -Fn | sed -n 's/^n127.0.0.1://p' || true)
              if [ -n "$port" ]; then break; fi
            fi
            sleep 1
          done
          test -n "$node_pid"
          curl --fail --retry 3 "http://127.0.0.1:$port/api/session" | grep -q csrf
          osascript -e 'tell application "FDUDash" to quit'
          sleep 2
          if kill -0 "$node_pid" 2>/dev/null; then echo 'Backend still running'; exit 1; fi
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/FDUDash.app dist/FDUDash-macos-${{ matrix.arch }}.zip
          cd dist
          shasum -a 256 FDUDash-macos-${{ matrix.arch }}.zip > SHA256SUMS-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FDUDash-macos-${{ matrix.arch }}
          path: |
            dist/FDUDash-macos-*.zip
            dist/SHA256SUMS-macos-*
