name: macOS desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - run: npm prune --omit=dev
      - run: node scripts/build-macos.mjs
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/FDUDash.app dist/FDUDash-macos-${{ matrix.arch }}.zip
          cd dist
          shasum -a 256 FDUDash-macos-${{ matrix.arch }}.zip > SHA256SUMS-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FDUDash-macos-${{ matrix.arch }}
          path: |
            dist/FDUDash-macos-*.zip
            dist/SHA256SUMS-macos-*
