<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fdudash</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body><div class="layout"><aside id="sidebar"><div class="sidebar-top"><a class="brand" href="#timetable"><b class="brand-short">f</b><span class="brand-full">fdu<span>dash</span><i data-i18n="复旦 · 每日">复旦 · 每日</i></span></a><button id="sidebar-toggle" class="secondary" aria-controls="sidebar" aria-expanded="true">☰</button></div><nav class="main-nav" aria-label="Campus"><a id="nav-timetable" class="nav active" href="#timetable" data-i18n-title="课表"><span class="nav-icon" aria-hidden="true">◷</span><span class="nav-label" data-i18n="课表">课表</span></a><a id="nav-elearning" class="nav" href="#elearning" title="elearning"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-label">elearning</span></a><a id="nav-exams" class="nav" href="#exams" data-i18n-title="考试"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label" data-i18n="考试">考试</span></a></nav><footer><button id="language-toggle" class="secondary">EN</button><div class="footer-copy">LOCAL FIRST<br><span data-i18n="你的校园，留在你的设备">你的校园，留在你的设备</span></div></footer></aside>
<main><header><div class="eyebrow">MY FUDAN</div><h1 data-i18n="把校园日常，安排得刚刚好。">把校园日常，安排得刚刚好。</h1><p data-i18n="从今天的课表开始。">从今天的课表开始。</p><span class="badge" data-i18n="本机运行 · 加密保存">本机运行 · 加密保存</span><button id="logout" class="secondary account-logout" data-i18n="退出并忘记账号" hidden>退出并忘记账号</button></header>
<section id="login-panel" class="card"><div><div class="eyebrow">CONNECT YOUR CAMPUS</div><h2 data-i18n="连接复旦 UIS">连接复旦 UIS</h2><p data-i18n="使用你的学号连接教务系统。勾选记住账号后，本机加密保存，下次打开自动连接。"></p><p class="hint" data-i18n="当前测试本科生课表；验证码和双因素认证暂未接入。请勿反复尝试错误密码。"></p></div><form id="login"><label><span data-i18n="学号">学号</span><input name="username" autocomplete="username" inputmode="numeric" required maxlength="20"></label><label><span data-i18n="UIS 密码">UIS 密码</span><input name="password" type="password" autocomplete="off" required maxlength="256"></label><label class="remember"><input type="checkbox" name="remember" checked><span data-i18n="在此设备记住账号">在此设备记住账号</span></label><button type="submit" data-i18n="连接并读取学期 →">连接并读取学期 →</button></form></section>
<section id="timetable-page" class="card timetable"><div class="section-head"><div><div class="eyebrow">TIMETABLE</div><h2 data-i18n="课表">课表</h2></div></div><div class="toolbar"><label><span data-i18n="学期">学期</span><select id="semester" disabled><option data-i18n="登录后选择学期">登录后选择学期</option></select></label><div class="week-navigation"><button id="prev-week" class="secondary" data-i18n-aria="上一周">←</button><label><span data-i18n="教学周">教学周</span><select id="week"><option value="1">第 1 周</option></select></label><button id="next-week" class="secondary" data-i18n-aria="下一周">→</button><button id="this-week" class="secondary" data-i18n="本周">本周</button></div><button id="refresh" disabled data-i18n="查询课表">查询课表</button></div><p id="status" role="status" aria-live="polite" data-i18n="尚未连接。登录后读取个人课表。"></p><p id="week-summary" class="week-summary" aria-live="polite"></p><div class="grid-scroll"><div id="grid" class="grid"></div></div></section>
<section id="elearning-page" class="card" hidden><div class="section-head"><div><div class="eyebrow">ELEARNING</div><h2 data-i18n="课程中心">课程中心</h2></div><button id="connect-elearning" disabled data-i18n="刷新课程信息">刷新课程信息</button></div><p id="elearning-status" role="status" data-i18n="自动读取课程信息，未完成作业优先，仅自动展开有未完成任务的作业模块。"></p><div class="elearning-workspace"><nav id="course-navigation" class="course-navigation" data-i18n-aria="课程导航"><label><span data-i18n="快速定位课程">快速定位课程</span><input id="course-search" type="search" data-i18n-placeholder="搜索课程"></label><div id="course-nav-list"></div></nav><div id="elearning-courses" class="elearning-courses"></div></div></section>
<section id="exams-page" class="card" hidden><div class="section-head"><div><div class="eyebrow">ACADEMIC EXAMS</div><h2 data-i18n="考试">考试</h2></div><button id="refresh-exams" disabled data-i18n="刷新考试信息">刷新考试信息</button></div><p id="exams-status" role="status" data-i18n="进入页面后自动读取教务考试安排。"></p><div id="exam-list"></div></section>
<p class="note" data-i18n="凭据使用 Windows 当前用户密钥加密，保存在仓库外。无云端账户、无统计脚本；请仅在自己的设备记住账号。"></p></main></div></body></html>
